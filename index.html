<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Ven a celebrarme! 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2e93;--yellow:#ffd60a;--cyan:#00c2ff;--lime:#b6ff3b;--purple:#3b0f7a;--ink:#1a0638;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--purple);color:#fff;font-family:'Fredoka',system-ui,sans-serif;font-weight:500;overflow-x:hidden;min-height:100vh}
h1,h2,.big{font-family:'Bagel Fat One','Fredoka',Impact,sans-serif;font-weight:400;margin:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* pantalla 1 */
#s1{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
background:linear-gradient(135deg,#ff2e93,#7b2ff7,#00c2ff,#b6ff3b,#ffd60a,#ff2e93);background-size:400% 400%;animation:bg 8s ease infinite;touch-action:manipulation}
#s1::before{content:"";position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;z-index:0;pointer-events:none;
background:repeating-conic-gradient(rgba(255,255,255,.22) 0 10deg,transparent 10deg 20deg);animation:spin 20s linear infinite}
#s1>*:not(.bl){position:relative;z-index:2}
#s1 h1{font-size:clamp(3rem,16vw,5.5rem);line-height:1;margin-bottom:18px;color:var(--yellow);text-shadow:4px 4px 0 var(--ink),8px 8px 0 var(--pink)}
#s1 h1 span{display:inline-block;animation:jump 1.1s ease-in-out infinite}
#s1 p{font-size:1.25rem;margin:0 0 40px;max-width:16em;background:var(--ink);color:#fff;padding:12px 18px;border-radius:20px;border:3px solid var(--yellow);animation:wob 2.4s ease-in-out infinite}
.bwrap{position:relative;display:inline-block}
.bwrap::before,.bwrap::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:4px solid #fff;animation:ring 1.6s ease-out infinite;pointer-events:none}
.bwrap::after{animation-delay:.8s}
#boom{position:relative;font-family:'Bagel Fat One',Impact,sans-serif;font-size:2rem;color:var(--ink);background:linear-gradient(90deg,var(--lime),var(--yellow),var(--lime));background-size:200% 100%;border:5px solid var(--ink);border-radius:999px;
padding:24px 38px;box-shadow:0 9px 0 var(--ink);cursor:pointer;animation:pulse 1s ease-in-out infinite,wig 2.5s ease-in-out infinite,shine 2s linear infinite;-webkit-tap-highlight-color:transparent}
#boom:active{transform:translateY(9px);box-shadow:0 0 0 var(--ink)}
.bl{position:absolute;bottom:-90px;z-index:3;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:rise var(--d) linear forwards}
.bl span{display:block;font-size:var(--s);animation:sway 2.2s ease-in-out infinite;padding:8px}
.bl.pop{animation:none;transition:transform .15s,opacity .15s;transform:scale(1.8);opacity:0}
@keyframes rise{to{transform:translateY(-125vh)}}
@keyframes sway{0%,100%{transform:translateX(-14px) rotate(-10deg)}50%{transform:translateX(14px) rotate(10deg)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.6,2);opacity:0}}
@keyframes wig{0%,85%,100%{rotate:0deg}88%{rotate:-6deg}92%{rotate:6deg}96%{rotate:-4deg}}
@keyframes shine{to{background-position:200% 0}}

/* pantalla 2 */
#s2{display:none;position:relative;padding:20px 14px 40px;text-align:center;overflow:hidden;
background:linear-gradient(135deg,#3b0f7a,#c4137a,#ff7a18,#3b0f7a);background-size:300% 300%;animation:bg 10s ease infinite}
#s2.show{display:block;animation:bg 10s ease infinite,pop .7s cubic-bezier(.2,1.6,.4,1)}
.wrap{position:relative;z-index:2;max-width:520px;margin:0 auto}
.title{font-size:clamp(2rem,9vw,3rem);color:var(--yellow);text-shadow:3px 3px 0 var(--ink);margin:6px 0 16px;animation:wob 2.2s ease-in-out infinite}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.clock div{background:var(--ink);border:4px solid var(--yellow);border-radius:18px;padding:12px 2px;box-shadow:0 6px 0 var(--pink)}
.clock b{display:block;font-family:'Bagel Fat One',Impact,sans-serif;font-weight:400;font-size:clamp(1.8rem,9vw,2.8rem);color:var(--lime);line-height:1}
.clock small{font-size:.85rem;color:#fff}
.t1{font-size:clamp(2rem,10vw,3.2rem);color:#fff;text-shadow:3px 3px 0 var(--cyan);margin:22px 0 4px;animation:wob 1.8s ease-in-out infinite}
.t2{font-size:1.5rem;margin:0;color:var(--yellow);font-weight:700}
.t3{font-size:1.5rem;margin:0;color:var(--lime);font-weight:700}
.polas{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 6px 10px}
.pola{background:#fff;color:var(--ink);padding:10px 10px 8px;border-radius:6px;box-shadow:0 8px 0 rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pola:nth-child(odd){transform:rotate(-4deg)}.pola:nth-child(even){transform:rotate(4deg)}
.pola .ph{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:4.2rem;overflow:hidden;animation:wob 2s ease-in-out infinite}
.pola img{width:100%;height:100%;object-fit:cover}
.pola span{display:block;font-size:.95rem;margin-top:6px;font-weight:700}
.hint{font-size:.85rem;opacity:.85;margin:6px 0 0}
.band{position:relative;z-index:1;overflow:hidden;white-space:nowrap;margin:0 -14px;transform:rotate(-3deg)}
.band div{display:inline-block;font-family:'Bagel Fat One',Impact,sans-serif;font-size:2rem;padding:6px 0;animation:slide 14s linear infinite}
.band.r div{animation-direction:reverse;animation-duration:18s}
.b1{background:var(--yellow);color:var(--ink)}.b2{background:var(--cyan);color:var(--ink)}.b3{background:var(--lime);color:var(--ink)}.b4{background:var(--pink);color:#fff}
.bg17{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg17 i{position:absolute;font-style:normal;font-family:'Bagel Fat One',Impact,sans-serif;color:rgba(255,255,255,.14);font-size:1.6rem;white-space:nowrap;animation:float 5s ease-in-out infinite}
.foot{font-size:1.1rem;margin-top:22px}
@keyframes wob{0%,100%{transform:rotate(-2.5deg) scale(1)}50%{transform:rotate(2.5deg) scale(1.06)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(8deg)}}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
<noscript><style>#s1{display:none!important}#s2{display:block!important}.clock{display:none!important}</style></noscript>
</head>
<body>
<canvas id="fx"></canvas>

<section id="s1">
  <h1 id="ttl">¡Alerta!</h1>
  <p>Qué interesante botón, yo lo picaría</p>
  <div class="bwrap"><button id="boom">¡PÍCALE AQUÍ! 💥</button></div>
</section>

<section id="s2">
  <div class="bg17" id="bg17"></div>
  <div class="wrap">
    <h2 class="title">🎉 FIESTA 🎉</h2>
    <noscript><p class="t2" style="margin:0 0 6px">Abre el archivo en Safari o Chrome para ver el cronómetro y la música</p></noscript>
    <div class="clock">

      <div><b id="s">00</b><small>seg</small></div>
    </div>
    <h2 class="t1">Ven a celebrar a mi padrino</h2>
    <p class="t2">Lugar: casa padrinos</p>
    <p class="t3">Hora: 6 pm</p>
  </div>

  <div class="band b1" style="margin-top:26px"><div id="r1"></div></div>

  <div class="band b2 r" style="margin-top:18px"><div id="r2"></div></div>
  <div class="band b4" style="margin-top:12px"><div id="r3"></div></div>

  <div class="wrap">
    <p class="foot">Sugerencia de regalo: pisto (digoq)</p>
  </div>
  <div class="band b3 r" style="margin-top:14px"><div id="r4"></div></div>
</section>

<script>
(function(){
  // textos "17 de oct" repetidos
  function fill(id,txt){var el=document.getElementById(id),s='';for(var i=0;i<24;i++)s+=txt+' ';el.textContent=s;}
  fill('r1','17 de oct ★');fill('r2','17 de oct 🎈');fill('r3','17 de oct 🎂');fill('r4','17 de oct 🎉');
  var bg=document.getElementById('bg17'),h='';
  for(var i=0;i<26;i++){h+='<i style="top:'+(i*3.9)+'%;left:'+((i*37)%80-6)+'%;animation-delay:'+(i%7)*.5+'s">17 de oct</i>';}
  bg.innerHTML=h;

  // sonido de explosión (WebAudio)
  function boom(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext,c=new AC();
      var len=c.sampleRate*1.6,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
      for(var i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);}
      var n=c.createBufferSource();n.buffer=buf;
      var f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(3500,c.currentTime);f.frequency.exponentialRampToValueAtTime(60,c.currentTime+1.4);
      var g=c.createGain();g.gain.setValueAtTime(1.6,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+1.6);
      var o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(140,c.currentTime);o.frequency.exponentialRampToValueAtTime(28,c.currentTime+.6);
      var og=c.createGain();og.gain.setValueAtTime(1.4,c.currentTime);og.gain.exponentialRampToValueAtTime(.01,c.currentTime+.8);
      n.connect(f);f.connect(g);g.connect(c.destination);o.connect(og);og.connect(c.destination);
      n.start();o.start();o.stop(c.currentTime+.9);
    }catch(e){}
    try{if(navigator.vibrate)navigator.vibrate([200,60,200]);}catch(e){}
  }

  // confeti
  var cv=document.getElementById('fx'),cx=cv.getContext('2d'),parts=[],run=false;
  function size(){cv.width=innerWidth;cv.height=innerHeight;}size();addEventListener('resize',size);
  var cols=['#ff2e93','#ffd60a','#00c2ff','#b6ff3b','#ff7a18','#fff'];
  function burst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*6.28,v=4+Math.random()*12;
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,s:5+Math.random()*7,c:cols[i%6],r:Math.random()*6,l:90+Math.random()*60});}
    if(!run){run=true;requestAnimationFrame(tick);}}
  function tick(){cx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){return p.l>0&&p.y<cv.height+20;});
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=.2;p.l--;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
    if(parts.length)requestAnimationFrame(tick);else run=false;}

  // pantalla de inicio: letras saltarinas, globos para reventar y estela
  var tt=document.getElementById('ttl'),tx=tt.textContent;tt.innerHTML='';
  tx.split('').forEach(function(ch,k){var s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(k*.09)+'s';tt.appendChild(s);});
  var s1=document.getElementById('s1'),em=['🎈','🎁','🎂','🥳','🎉','🪩','🍰','🎊','🍕','🌮'];
  function popSnd(){try{ac=ac||new AC2();if(ac.state==='suspended')ac.resume();tone('sine',1100,160,0,.1,.7);tone('square',300,60,0,.05,.3);}catch(e){}}
  function spawn(early){
    if(!s1||s1.style.display==='none')return;
    var b=document.createElement('div'),sp=document.createElement('span'),d=7+Math.random()*6;
    b.className='bl';b.style.left=(Math.random()*84+2)+'%';b.style.setProperty('--d',d+'s');b.style.setProperty('--s',(2.4+Math.random()*1.8)+'rem');
    if(early)b.style.animationDelay='-'+(Math.random()*d*.8)+'s';
    sp.textContent=em[Math.floor(Math.random()*em.length)];sp.style.animationDelay='-'+Math.random()*2+'s';b.appendChild(sp);
    b.addEventListener('animationend',function(ev){if(ev.animationName==='rise')b.remove();});
    function pop(ev){ev.stopPropagation();ev.preventDefault();if(b.classList.contains('pop'))return;popSnd();
      var r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,35);try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
      b.classList.add('pop');setTimeout(function(){b.remove();},180);}
    b.addEventListener('pointerdown',pop);
    s1.appendChild(b);}
  for(var q=0;q<9;q++)spawn(true);
  setInterval(function(){if(s1.querySelectorAll('.bl').length<13)spawn(false);},650);
  var lastT=0;
  s1.addEventListener('pointermove',function(e){var n=Date.now();if(n-lastT<40)return;lastT=n;burst(e.clientX,e.clientY,2);});
  s1.addEventListener('pointerdown',function(e){if(e.target.closest('#boom'))return;burst(e.clientX,e.clientY,18);});

  // botón
  document.getElementById('boom').addEventListener('click',function(e){
    boom();
    burst(innerWidth/2,innerHeight/2,160);
    document.body.animate([{transform:'translate(0,0)'},{transform:'translate(-12px,8px)'},{transform:'translate(12px,-8px)'},{transform:'translate(-8px,-6px)'},{transform:'translate(0,0)'}],{duration:450});
    setTimeout(function(){
      document.getElementById('s1').style.display='none';
      document.getElementById('s2').classList.add('show');
      window.scrollTo(0,0);
      burst(innerWidth*.2,innerHeight*.3,80);burst(innerWidth*.8,innerHeight*.3,80);
    },550);
  });

  // cronómetro: 17 de octubre, 6 pm (hora local)
  function target(){var n=new Date(),t=new Date(n.getFullYear(),9,17,18,0,0);
    if(n-t>24*3600*1000)t=new Date(n.getFullYear()+1,9,17,18,0,0);return t;}
  var T=target();
  function pad(v){return v<10?'0'+v:''+v;}
  function upd(){var diff=T-new Date();
    if(diff<=0){['d','h','m','s'].forEach(function(k){document.getElementById(k).textContent='00';});
      document.querySelector('.title').textContent='🎉 ¡ES HOY! 🎉';return;}
    var s=Math.floor(diff/1000);
    document.getElementById('d').textContent=pad(Math.floor(s/86400));
    document.getElementById('h').textContent=pad(Math.floor(s%86400/3600));
    document.getElementById('m').textContent=pad(Math.floor(s%3600/60));
    document.getElementById('s').textContent=pad(s%60);}
  upd();setInterval(upd,1000);

  // sonidos chistosos por foto
  var AC2=window.AudioContext||window.webkitAudioContext,ac=null;
  function tone(type,f0,f1,t0,dur,vol,vib){
    var o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t0;
    o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);
    if(vib){var l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=vib;lg.gain.value=f0*.08;l.connect(lg);lg.connect(o.frequency);l.start(n);l.stop(n+dur);}
    g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);
    o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+dur+.05);}
  var sounds=[
    function(){tone('sawtooth',330,330,0,.18,.3);tone('sawtooth',440,440,.2,.18,.3);tone('sawtooth',660,660,.4,.5,.3,12);}, // corneta de fiesta
    function(){tone('sine',180,700,0,.25,.6,0);tone('sine',700,150,.25,.45,.6,25);}, // boing
    function(){tone('sawtooth',311,311,0,.4,.35,6);tone('sawtooth',293,293,.45,.4,.35,6);tone('sawtooth',277,277,.9,.4,.35,6);tone('sawtooth',261,196,1.35,.9,.35,9);}, // trombón triste
    function(){tone('sine',1500,90,0,1.1,.5,14);tone('square',120,60,1.1,.25,.4);} // silbato que cae + bonk
  ];
  document.querySelectorAll('.pola').forEach(function(p,i){p.addEventListener('click',function(){
    try{ac=ac||new AC2();if(ac.state==='suspended')ac.resume();sounds[i]();}catch(e){}
    try{if(navigator.vibrate)navigator.vibrate(80);}catch(e){}
    p.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1.15) rotate(-8deg)'},{transform:'scale(.95) rotate(6deg)'},{transform:'scale(1) rotate(0)'}],{duration:400});
    var b=p.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,25);
  });});
  // confeti al tocar la pantalla 2
  document.getElementById('s2').addEventListener('click',function(e){if(e.target.closest('.pola'))return;burst(e.clientX,e.clientY,30);});
